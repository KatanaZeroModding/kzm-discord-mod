[package]
name = "kzm-discord-native"
version = "0.1.0"
edition = "2021"
publish = false
description = "Discord Rich Presence plugin for a KZM mod"

[lib]
crate-type = ["cdylib", "rlib"]
name = "kzm_discord"
path = "src/lib.rs"

[dependencies]
discord-rich-presence = "=0.2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true
